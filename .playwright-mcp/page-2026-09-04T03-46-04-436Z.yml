              - generic [ref=e371]:
                - textbox "Sample Test Cases (JSON)" [ref=e372]: "[ { \"testCaseId\": \"TC_305\", \"module\": \"Laboratory\", \"testCaseTitle\": \"Lab Report Email Notification - Validated Results\", \"testCaseDescription\": \"Verify that the system sends email notification to patients when lab test results are validated and marked as complete by the technician.\", \"testSteps\": [ \"1. Technician logs into Laboratory module\", \"2. Select pending test for Patient UHID: 123456-7890\", \"3. Enter test results in result_values field\", \"4. Click 'Validate Results' button\", \"5. System marks test status as 'VALIDATED'\", \"6. Verify email sent to patient registered email\", \"7. Verify notification logged in patient_notifications table\" ], \"expectedResults\": \"Email sent successfully with subject 'Lab Report Ready - [Test Name]', patient_notifications table updated with timestamp and delivery status, test status changed to VALIDATED in lab_tests table\", \"priority\": \"P1 (Critical)\", \"testType\": \"Integration\", \"linkedUserStories\": [\"HC-098\"], \"complianceNotes\": \"HIPAA - Email must be encrypted, link expires in 48 hours\" }, { \"testCaseId\": \"TC_306\", \"module\": \"Patient Communication\", \"testCaseTitle\": \"SMS Notification - Appointment Reminder\", \"testCaseDescription\": \"Verify system sends SMS reminder to patient 24 hours before scheduled appointment with proper formatting and delivery tracking.\", \"testSteps\": [ \"1. Schedule appointment for patient (UHID: 123456-7890) for tomorrow 10:00 AM\", \"2. Wait for scheduled SMS trigger (24 hours before appointment)\", \"3. Verify SMS content includes: Patient name, Doctor name, Date, Time, Location\", \"4. Verify SMS sent to registered mobile: +91-9876543210\", \"5. Check sms_logs table for delivery status\" ], \"expectedResults\": \"SMS delivered successfully with message: 'Dear [Patient], Appointment with Dr. [Name] scheduled for [Date] at [Time]. Location: [Building]. Call 1800-XXX for changes.' Delivery status logged as 'SENT' in sms_logs table.\", \"priority\": \"P2 (High)\", \"testType\": \"Integration\", \"linkedUserStories\": [\"HC-102\"], \"complianceNotes\": \"Ensure patient opted-in for SMS notifications\" }, { \"testCaseId\": \"TC_308\", \"module\": \"Diagnostics\", \"testCaseTitle\": \"Report Generation - PDF Format with Patient Data\", \"testCaseDescription\": \"Verify diagnostic report is generated in PDF format with complete patient demographics, test results, reference ranges, and technician signature.\", \"testSteps\": [ \"1. Navigate to Diagnostics Report Generation module\", \"2. Select validated test for Patient UHID: 123456-7890\", \"3. Click 'Generate PDF Report' button\", \"4. System retrieves patient demographics from patient_master\", \"5. System formats test results with reference ranges\", \"6. System adds digital signature of validating technician\", \"7. PDF saved to reports/ directory with naming: UHID_TestType_Date.pdf\" ], \"expectedResults\": \"PDF generated successfully with sections: Patient Demographics (Name, UHID, Age, Gender), Test Details (Test Name, Sample ID, Collection Date), Results Table (Parameter, Value, Reference Range, Units), Technician Signature (Name, License, Date). File size < 5MB. PDF is password-protected with patient DOB.\", \"priority\": \"P1 (Critical)\", \"testType\": \"Functional\", \"linkedUserStories\": [\"HC-087\"], \"complianceNotes\": \"HIPAA - PDF encryption mandatory, watermark 'CONFIDENTIAL'\" }, { \"testCaseId\": \"TC_310\", \"module\": \"Patient Communication\", \"testCaseTitle\": \"WhatsApp Message - Delivery Status Tracking\", \"testCaseDescription\": \"Verify system tracks WhatsApp message delivery status (sent, delivered, read) and logs all status changes for audit purposes.\", \"testSteps\": [ \"1. Trigger WhatsApp notification for patient (UHID: 123456-7890)\", \"2. System sends message via WhatsApp Business API\", \"3. Monitor webhook for delivery status updates\", \"4. Verify status transitions: SENT → DELIVERED → READ\", \"5. Check whatsapp_logs table for status history\", \"6. Verify timestamp recorded for each status change\" ], \"expectedResults\": \"All status transitions logged in whatsapp_logs table with columns: message_id, uhid, status (SENT/DELIVERED/READ/FAILED), timestamp, error_code (if failed). Dashboard shows real-time delivery status. Failed messages flagged for retry.\", \"priority\": \"P2 (High)\", \"testType\": \"Integration\", \"linkedUserStories\": [\"HC-125\"], \"complianceNotes\": \"Retain delivery logs for 7 years per HIPAA audit requirements\" }, { \"testCaseId\": \"TC_311\", \"module\": \"Security\", \"testCaseTitle\": \"Patient Consent Verification - WhatsApp Communication\", \"testCaseDescription\": \"Verify system checks patient consent status before sending WhatsApp messages and blocks communication if consent not granted.\", \"testSteps\": [ \"1. Navigate to Patient Registration module\", \"2. Create/Select patient record (UHID: 123456-7890)\", \"3. Verify consent_whatsapp flag is set to FALSE in patient_consent table\", \"4. Attempt to trigger WhatsApp notification for lab report\", \"5. Verify system blocks message sending\", \"6. Verify error logged: 'Patient consent not granted for WhatsApp communication'\" ], \"expectedResults\": \"WhatsApp message not sent. Error message displayed to technician: 'Patient has not consented to WhatsApp communication. Use alternative methods.' Event logged in audit_logs with reason: NO_CONSENT. Patient record shows alternative communication preferences.\", \"priority\": \"P1 (Critical)\", \"testType\": \"Functional - Security\", \"linkedUserStories\": [\"HC-125\"], \"complianceNotes\": \"HIPAA - Explicit patient consent required before PHI transmission via third-party platforms\" } ]"
