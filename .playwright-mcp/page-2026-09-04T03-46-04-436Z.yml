                  - text: "Module: Patient Communication & Diagnostics User Story ID: HC-125 User Story Title: Share Diagnostic Reports with Patients via WhatsApp User Story Description: As a diagnostic technician, I want to automatically send patients their lab test reports securely through WhatsApp once results are validated, so that patients can access their diagnostic data conveniently without logging into the hospital portal. Acceptance Criteria: 1. Report must be sent only after validation by authorized technician 2. WhatsApp message must include secure download link with expiration (24 hours) 3. Patient consent for WhatsApp communication must be verified 4. System must log all report delivery attempts 5. Support for PDF format with encryption 6. Handle failure scenarios (invalid number, WhatsApp service down) 7. Comply with HIPAA requirements for PHI transmission"
